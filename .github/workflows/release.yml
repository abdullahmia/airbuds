name: Release

# Push a tag like v0.2.0 to build a universal app and publish a GitHub release
# with a DMG, a zip, SHA256SUMS.txt and appcast.xml (the Sparkle update feed that
# installed copies check). Can also be run by hand from the Actions tab.
#
# Needs the repository secret SPARKLE_PRIVATE_KEY (the EdDSA key from Sparkle's
# generate_keys). Without it the release still publishes, but installed copies
# won't be offered the update.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Work out version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Build checks
        run: swift build -c release --product AirBudsKitChecks

      - name: Protocol checks
        timeout-minutes: 2
        run: swift run -c release --skip-build AirBudsKitChecks

      - name: Build app (universal)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh --universal

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package DMG and zip
        run: scripts/make-dmg.sh "${{ steps.version.outputs.version }}"

      - name: Update feed (appcast.xml)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY is not set, so there is no appcast.xml; installed copies won't see this update"
          else
            scripts/make-appcast.sh "${{ steps.version.outputs.version }}" "${{ github.run_number }}"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          NOTES=$(cat <<NOTES
          ## Install

          1. Download **AirBuds-$VERSION.dmg**, open it and drag **AirBuds** into **Applications**.
          2. The app is ad-hoc signed, not notarized. On first launch macOS blocks it: open
             **System Settings → Privacy & Security** and click **Open Anyway**, or run
             \`xattr -dr com.apple.quarantine "/Applications/AirBuds.app"\`.
          3. Allow Bluetooth access when asked.

          If your AirBuds has **Check for Updates…** in its right-click menu, it
          offers this update by itself; no download needed.

          Universal build (Apple Silicon and Intel), macOS 13 or later.
          Checksums are in SHA256SUMS.txt.
          NOTES
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "AirBuds $VERSION" --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi
