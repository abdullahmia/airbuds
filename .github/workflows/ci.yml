name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Build checks
        run: swift build -c release --product AirBudsKitChecks

      - name: Protocol checks
        timeout-minutes: 2
        run: swift run -c release --skip-build AirBudsKitChecks

      - name: Build app (universal)
        run: scripts/build-app.sh --universal

      - name: Check architectures
        run: lipo -archs "build/AirBuds.app/Contents/MacOS/AirBuds"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package DMG
        run: scripts/make-dmg.sh 0.0.0-ci
